[project]
name = "gitcg-world-model"
version = "0.1.0"
description = "PyTorch world-model and RL research stack for Genius Invokation TCG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.8.0",
  "gitcg>=0.17.4",
  "protobuf>=5.29.1",
  "trueskill>=0.4.5",
]

[project.optional-dependencies]
cloud = [
  "boto3>=1.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
